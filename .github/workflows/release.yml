name: Release Packaging

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS DMG (Apple Silicon & Intel)
            os: macos-latest
            target: universal-apple-darwin
            artifact_pattern: "apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg"
          - name: Windows MSI & NSIS Installer
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_pattern: "apps/desktop/src-tauri/target/release/bundle/msi/*.msi,apps/desktop/src-tauri/target/release/bundle/nsis/*.exe"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build frontend production bundle
        working-directory: apps/desktop
        run: npm run build

      - name: Build desktop release packages with Tauri 2
        working-directory: apps/desktop
        run: npx @tauri-apps/cli build

      - name: Upload packaging artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Reclaim-${{ matrix.platform.os }}-bundle
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false

