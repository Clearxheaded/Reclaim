name: Release Packaging

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.0)"
        required: false
        default: "v0.1.0"
        type: string
      draft:
        description: "Publish as draft release"
        required: false
        default: true
        type: boolean
      prerelease:
        description: "Publish as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS DMG (Apple Silicon & Intel)
            os: macos-latest
            artifact_pattern: "target/release/bundle/dmg/*.dmg"
          - name: Windows MSI & NSIS Installer
            os: windows-latest
            artifact_pattern: "target/release/bundle/msi/*.msi,target/release/bundle/nsis/*.exe"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build frontend production bundle
        working-directory: apps/desktop
        run: npm run build

      - name: Build desktop release packages with Tauri 2
        working-directory: apps/desktop
        run: npx @tauri-apps/cli build

      - name: Upload packaging artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Reclaim-${{ matrix.platform.os }}-bundle
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (inputs.tag_name || 'v0.1.0') }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (inputs.tag_name || 'v0.1.0') }}
          draft: ${{ github.event_name == 'workflow_dispatch' && (inputs.draft == true) || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && (inputs.prerelease == true) || false }}
          fail_on_unmatched_files: false
          generate_release_notes: true
