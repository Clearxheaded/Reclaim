[package]
name = "reclaim-core"
version = "0.1.0"
edition = "2021"
authors = ["Reclaim Contributors"]
description = "Core library for Reclaim filesystem scanner and cleanup engine"
license = "MIT"

[dependencies]
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"


