[package]
name = "reclaim-core"
version = "0.1.0"
edition = "2021"
authors = ["Reclaim Contributors"]
description = "Core library for Reclaim filesystem scanner and cleanup engine"
license = "MIT"

[dependencies]
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = "6.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "hashing_benchmarks"
harness = false

[[bench]]
name = "pipeline_benchmarks"
harness = false



