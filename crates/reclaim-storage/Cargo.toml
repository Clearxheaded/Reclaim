[package]
name = "reclaim-storage"
version = "0.1.0"
edition = "2021"
authors = ["Reclaim Contributors"]
description = "Durable SQLite-backed execution journal and recovery store for Reclaim"
license = "MIT"

[dependencies]
reclaim-core = { path = "../reclaim-core" }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.10"

